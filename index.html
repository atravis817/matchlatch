<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATCHLATCH — Your style, unlocked.</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #09090b;
        color: #fafafa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), transparent 35%),
          #09090b;
      }
      .wrap { width: min(900px, 100%); text-align: center; }
      .eyebrow {
        letter-spacing: .28em;
        font-size: 12px;
        font-weight: 700;
        color: #a1a1aa;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(48px, 10vw, 100px);
        line-height: .95;
        letter-spacing: -.055em;
      }
      .tagline {
        margin: 22px 0 36px;
        font-size: clamp(20px, 3vw, 30px);
        color: #d4d4d8;
      }
      .card {
        margin: 0 auto;
        max-width: 620px;
        padding: 28px;
        border: 1px solid #27272a;
        border-radius: 24px;
        background: rgba(24,24,27,.72);
        backdrop-filter: blur(14px);
      }
      .card p { color: #a1a1aa; line-height: 1.7; margin: 0; }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        background: #fafafa;
        color: #09090b;
        font-weight: 800;
        cursor: pointer;
      }
      button:hover { opacity: .88; }
      footer { margin-top: 28px; font-size: 12px; color: #52525b; }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <div class="eyebrow">MATCHLATCH</div>
        <h1>Your style,<br />unlocked.</h1>
        <div class="tagline">Show us what you like. We'll help you find what comes next.</div>
        <div class="card">
          <p>
            MATCHLATCH is being built as a personal style engine that turns inspiration
            into curated outfits, products, and shopping options that fit your taste and budget.
          </p>
          <button type="button" onclick="alert('MATCHLATCH is coming together. 🚀')">GET STARTED</button>
        </div>
        <footer>Early build • MATCHLATCH</footer>
      </div>
    </main>
  </body>
</html>
