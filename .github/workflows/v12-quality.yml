name: MATCHLATCH V1.2 staging quality gate
on:
  push:
    branches:
      - design/v1.2-studio-first-100926
      - integration/v1.2-global-discovery-20261013
      - feature/v1.2-awin-commerce-20261013
      - feature/wo-ml-015-checkout-20261013
      - feature/wo-ml-017-unified-discovery
      - feature/wo-ml-018a-nightly-shopify-sync
      - staging/v1.1-tile-cleanup-100926
  pull_request:
    branches:
      - feature/wo-ml-015-checkout-20261013
      - feature/v1.2-awin-commerce-20261013
      - integration/v1.2-global-discovery-20261013
      - main
      - staging/v1.1-tile-cleanup-100926
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all app and backend JavaScript
        run: |
          find . -path './.git' -prune -o \( -name '*.js' -o -name '*.mjs' \) -type f -print0 | xargs -0 -n1 node --check
      - name: Regression audit
        run: node scripts/audit.mjs
      - name: Install pinned ephemeral PostgreSQL test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/matchlatch-sql" --no-audit --no-fund @electric-sql/pglite@0.5.9
          echo "MATCHLATCH_PGLITE_MODULE=$RUNNER_TEMP/matchlatch-sql/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Complete isolated regression suite
        run: node --test scripts/test-*.mjs
      - name: Public catalog policy tests
        run: node scripts/test-public-catalog.mjs
      - name: Delivery intelligence tests
        run: node scripts/test-delivery-intelligence.mjs

      - name: Import and grounded styling security tests
        run: |
          node scripts/test-awin-import.mjs
          node scripts/test-catalog-styling.mjs

      - name: Permanent commerce policy and intelligence tests
        run: |
          node scripts/check-commerce-policy.mjs
          node scripts/test-commerce.mjs

      - name: Owner KPI authorization, calculations and export tests
        run: |
          node scripts/test-admin-dashboard.mjs
          node scripts/test-owner-navigation.mjs
