<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MATCHLATCH Preview layout checks</title>
<style>body{margin:24px;background:#f4f5f2;color:#303c31;font:16px system-ui}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{padding:12px;border:1px solid #303c31;border-radius:8px;background:white;color:inherit}iframe{display:block;border:1px solid #aeb9ad;height:844px;background:white;width:390px;max-width:100%}p{max-width:800px}</style>
<h1>Preview layout checks</h1><p>This frame loads the actual app at an iPhone-sized CSS viewport. It does not simulate Safari or a physical device. Private fictional fixtures require verified owner sign-in and cannot be saved or purchased.</p>
<nav aria-label="Test viewport"><button data-width="390">390 × 844</button><button data-width="430">430 × 844</button><button data-width="1280">Desktop 1280 × 844</button><button data-screen="store">Store</button><button data-screen="studio">Studio</button></nav><iframe title="Actual Preview app" src="/?catalogQa=1#store"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>frame.src='/?catalogQa=1#'+b.dataset.screen);</script></html>
