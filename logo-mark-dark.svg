<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 170" fill="none" role="img" aria-labelledby="title">
  <title id="title">MATCHLATCH open lock with an M and trailing L clothing tag, dark mode</title>
  <!-- Open shackle -->
  <path d="M55 59V40C55 22.3 68.7 11 86 11C104.3 11 119 25.7 119 44V52"
        stroke="#E9F0E8" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Solid lock body -->
  <rect x="34" y="67" width="106" height="93" rx="12" fill="#E9F0E8"/>
  <!-- Negative-space M, purposefully bold for small sizes -->
  <path d="M52 145V89H66L87 110L108 89H122V145H105V115L87 131L69 115V145H52Z" fill="#141714"/>
  <!-- A gently flowing garment-tag cord -->
  <path d="M139 80C153 89 160 91 172 83C186 73 190 70 199 80C204 86 206 96 210 106"
        stroke="#E9F0E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clothing size tag -->
  <path d="M208 96L228 91C231.9 90 234.3 91.9 235.5 95.6L246 125.5C247.2 129 245.6 132 241.9 133.5L221 143.8C217.4 145.6 214.4 144.4 212.8 140.6L198.2 110.7C196.6 107 198 103.9 201.2 101.4L208 96Z" fill="#E9F0E8"/>
  <circle cx="208" cy="106" r="3" fill="#141714"/>
  <!-- Size L -->
  <path d="M216 110L223.2 128L233 123.9" stroke="#141714" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>